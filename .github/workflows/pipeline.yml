name: Stage 1 features

# Nightly, after the day's reading is done. Not in a Worker: the feature pass
# loops over megabytes of text and the free plan allows 10ms of CPU per
# invocation.
on:
  schedule:
    - cron: '0 6 * * *'      # 06:00 UTC, roughly 11pm Pacific
  workflow_dispatch:          # and on demand, which is how you debug it

jobs:
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/pipeline/requirements.txt

      - run: pip install -r app/pipeline/requirements.txt

      # The tests are cheap and they are the only thing standing between a
      # broken signal and a corpus scored with it.
      - run: python -m pytest pipeline/ -q
        working-directory: app

      - run: python pipeline/client.py --base "$NEATINFO_API_URL"
        working-directory: app
        env:
          NEATINFO_API_URL: ${{ secrets.NEATINFO_API_URL }}
          NEATINFO_DISCOVER_KEY: ${{ secrets.NEATINFO_DISCOVER_KEY }}
