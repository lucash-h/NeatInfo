name: Deploy NeatInfo

on:
  push:
    branches: [main, dev]
  # Also on a pull request, so the test gate below actually runs *before* a
  # merge rather than for the first time on main. Deploying is gated on the
  # branch, not the event -- see the conditions on those steps.
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # wrangler.test.toml is generated from wrangler.toml; if they have
      # drifted, the suite is testing a different environment than the one that
      # deploys, which is worth failing over.
      - run: node scripts/sync-test-config.mjs

      # Gate the deploy on the test suite before anything else touches the
      # remote: a broken worker must never get as far as `wrangler deploy`, or
      # even as far as `npm run build`, which is why this runs before the
      # build step rather than after it.
      - run: npm test

      # dist/ is gitignored, so the assets the Worker serves have to be built here.
      - run: npm run build

      # Nothing below this line runs anywhere but a push to main. A feature
      # branch and dev both get the tests and the build; only main touches the
      # remote database or deploys. Keying this on the event alone would have
      # meant a push to dev deploying to production.
      - name: Apply D1 migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler d1 execute neatinfo --remote --file=./schema.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
