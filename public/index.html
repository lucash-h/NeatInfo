<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>NeatInfo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="gate" class="gate" hidden>
  <form class="gate-card" id="gate-form">
    <h1 class="gate-title">NeatInfo</h1>
    <p class="gate-note">One passphrase. Nothing to sign up for.</p>
    <input class="input" id="gate-input" type="password" autocomplete="current-password" placeholder="Passphrase" required>
    <p class="gate-error" id="gate-error" hidden></p>
    <button class="btn btn-primary" type="submit">Enter</button>
  </form>
</div>

<div id="app" class="app" hidden>

  <!-- Desktop rail. Collapses below 1100px; the phone tabs take over. -->
  <nav class="rail">
    <span class="wordmark">NeatInfo</span>
    <button class="btn btn-primary rail-add" data-action="open-add">Add article</button>
    <div class="rail-nav">
      <button class="rail-link" data-surface="today">Today <span class="count" data-count="today">0</span></button>
      <button class="rail-link" data-surface="pending">Pending <span class="count" data-count="pending">0</span></button>
      <button class="rail-link" data-surface="archive">Archive</button>
      <button class="rail-link" data-surface="starred">Starred</button>
    </div>
    <div class="rail-tags">
      <span class="eyebrow">Tags</span>
      <div class="tag-row" id="rail-tags"></div>
    </div>
    <div class="rail-foot">
      <button class="rail-meta" data-action="open-settings">Lapse window · <span data-lapse-window>14</span> days</button>
      <a class="rail-export" href="/api/export">Export JSON</a>
    </div>
  </nav>

  <main class="main">
    <!-- Phone chrome. No painted status bar: the real one renders on top. -->
    <header class="topbar">
      <span class="wordmark">NeatInfo</span>
      <button class="btn btn-primary btn-sm" data-action="open-add">Add</button>
    </header>

    <div class="tabs">
      <button class="tab" data-surface="today">Today <span class="count" data-count="today">0</span></button>
      <button class="tab" data-surface="pending">Pending <span class="count" data-count="pending">0</span></button>
      <button class="tab" data-surface="archive">Archive</button>
    </div>

    <div class="surface" id="surface"></div>
  </main>

  <!-- Desktop reading pane. On phone this becomes a full-screen overlay. -->
  <section class="reader" id="reader" hidden>
    <div class="reader-bar">
      <button class="link-btn reader-back" data-action="close-reader">‹ Back</button>
      <div class="reader-actions" id="reader-actions"></div>
      <span class="eyebrow" id="reader-status"></span>
      <span class="keyhint">K keep · S star · X dismiss · J / L move</span>
    </div>
    <div class="reader-body" id="reader-body"></div>
    <div class="reader-foot" id="reader-foot"></div>
  </section>
</div>

<div class="sheet-scrim" id="add-sheet" hidden>
  <form class="sheet" id="add-form">
    <div class="sheet-head">
      <span class="sheet-title">Add to today</span>
      <button class="link-btn muted" type="button" data-action="close-add">Cancel</button>
    </div>
    <input class="input" id="add-url" type="url" inputmode="url" autocomplete="off" placeholder="Paste a URL">
    <div class="notice" id="add-notice" hidden></div>
    <button class="btn btn-primary btn-tall" type="submit" id="add-submit">Fetch and add</button>
    <div class="sheet-alt">
      <span class="sheet-alt-q">Behind a login wall, or a PDF?</span>
      <button class="link-btn" type="button" data-action="toggle-paste">Paste the text instead →</button>
      <div class="paste-fields" id="paste-fields" hidden>
        <input class="input" id="add-title" placeholder="Title">
        <input class="input" id="add-source" placeholder="Source">
        <textarea class="input textarea" id="add-text" rows="6" placeholder="Paste the article text"></textarea>
      </div>
      <span class="sheet-alt-note">A failed fetch still creates the item with its URL. Never a dead end.</span>
    </div>
  </form>
</div>

<div class="sheet-scrim" id="settings-sheet" hidden>
  <form class="sheet" id="settings-form">
    <div class="sheet-head">
      <span class="sheet-title">Settings</span>
      <button class="link-btn muted" type="button" data-action="close-settings">Close</button>
    </div>
    <label class="field">
      <span class="field-label">Lapse window</span>
      <span class="field-hint">Anything in Pending this long archives itself as lapsed. Still searchable.</span>
      <input class="input" id="lapse-input" type="number" min="1" max="365" step="1">
    </label>
    <button class="btn btn-primary btn-tall" type="submit">Save</button>
    <div class="sheet-alt">
      <a class="link-btn" href="/api/export">Export everything as JSON</a>
      <button class="link-btn muted" type="button" data-action="sign-out">Sign out</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
