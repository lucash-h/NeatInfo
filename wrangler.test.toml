# Generated from wrangler.toml with the [ai] binding removed. Do not edit.
#
# Workers AI has no local mode: declaring the binding makes vitest open a
# remote proxy session, which needs CLOUDFLARE_API_TOKEN. That would make the
# whole test suite depend on Cloudflare credentials and connectivity -- and it
# would break the CI test gate, which runs before the deploy step that has the
# credentials. Every speech test stubs env.AI anyway, so the binding was pure
# overhead in tests.
#
# Regenerate with: node scripts/sync-test-config.mjs --write
name = "neatinfo"
main = "worker/index.js"
compatibility_date = "2026-01-15"

# Static frontend served by the same Worker, so there is one deploy and no
# cross-origin dance between Pages and the API.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Tier 2 speech. Workers AI always runs remotely, even under `wrangler dev`,
# so a local dev server still spends real neurons -- 10,000 a day are free.
# Optional: delete this block and listening falls back to the browser's own
# voice, which is what it used before. §6
[[d1_databases]]
binding = "DB"
database_name = "neatinfo"
database_id = "b04836bd-d5bc-4040-9c79-f1f583c75678"

# Raw page HTML only. 200KB-2MB each would blow past D1's free tier within a
# year; R2 gives 10GB free with free egress. §5.2
# Optional: delete this block and articles still save, just without raw capture.
[[r2_buckets]]
binding = "RAW"
bucket_name = "neatinfo-raw"

# Secrets, set with `wrangler secret put <NAME>` -- never in this file:
#   PASSPHRASE      the single shared passphrase
#   SESSION_SECRET  random string used to sign the session cookie
